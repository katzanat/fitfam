<!doctype html>
<html lang="he" dir="rtl" data-kid="shira">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitFam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#141C33; --muted:#59627A;
  --line:#DCE2EE; --line-strong:#9AA6BF;
  --shira:#E2335C; --yonatan:#2559F0; --mom:#8B3FD9; --dad:#0B7A54; --gold:#D98E00; --on-accent:#FFFFFF;
  --accent:var(--shira);
  --accent-soft:color-mix(in srgb, var(--accent) 11%, var(--surface));
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-kid="yonatan"]{--accent:var(--yonatan)}
:root[data-kid="mom"]{--accent:var(--mom)}
:root[data-kid="dad"]{--accent:var(--dad)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1222; --surface:#151D33; --surface-2:#1B2540; --ink:#EDF1FA; --muted:#9BA6BF;
    --line:#26314F; --line-strong:#5A6888;
    --shira:#FF6E8C; --yonatan:#7A9EFF; --mom:#B98CFF; --dad:#3FD39A; --gold:#FFC23D; --on-accent:#0C1222;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#151D33; --surface-2:#1B2540; --ink:#EDF1FA; --muted:#9BA6BF;
  --line:#26314F; --line-strong:#5A6888;
  --shira:#FF6E8C; --yonatan:#7A9EFF; --mom:#B98CFF; --dad:#3FD39A; --gold:#FFC23D; --on-accent:#0C1222;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp{font-family:"Secular One","Assistant",Arial,sans-serif;font-weight:400}

.app{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{font-family:"Secular One",Arial,sans-serif;font-size:26px;line-height:1;margin:4px 0 12px;color:var(--ink);letter-spacing:.5px}
.brand span{color:var(--accent)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lang{color:var(--accent);font-weight:700;text-decoration:none;padding:10px 4px;min-height:44px;display:inline-flex;align-items:center}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700;min-height:44px}
.kid .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Secular One",Arial,sans-serif;font-size:17px}
.kid[data-k="shira"] .dot{background:var(--shira)}
.kid[data-k="yonatan"] .dot{background:var(--yonatan)}
.kid[data-k="mom"] .dot{background:var(--mom)}
.kid[data-k="dad"] .dot{background:var(--dad)}
.kid[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.icon{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.jersey{margin-top:14px;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:16px 20px 16px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"who num" "stats num" "bar bar" "next next";gap:6px 16px;overflow:hidden}
.jersey .who{grid-area:who;font-family:"Secular One",Arial,sans-serif;font-size:30px;line-height:1.1}
.jersey .who small{display:block;font-family:"Assistant",Arial,sans-serif;font-size:16px;font-weight:700;opacity:.9}
.jersey .num{grid-area:num;font-family:"Secular One",Arial,sans-serif;font-size:118px;line-height:.82;align-self:center;letter-spacing:-3px}
.stats{grid-area:stats;display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:24px;line-height:1.05}
.stat span{font-size:14px;opacity:.88}
.lvbar{grid-area:bar;height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-accent) 25%,transparent);overflow:hidden;margin-top:8px}
.lvbar i{display:block;height:100%;background:var(--on-accent);border-radius:99px}
.next{grid-area:next;font-size:14px;opacity:.9}

.shead h2{font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:27px;margin:22px 0 2px;line-height:1.15}
.meta{color:var(--muted);font-size:15px}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700}
.prow .gold{color:var(--gold)}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.ex{display:grid;grid-template-columns:86px 1fr 50px;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px;margin-bottom:10px;border:2px solid transparent}
.ex.done{border-color:var(--accent);background:var(--accent-soft)}
.ex h3{margin:0;font-size:18px;line-height:1.2}
.rx{font-weight:700;color:var(--accent);font-size:16px;margin-top:3px;line-height:1.3}
.cue{color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.check{width:50px;height:50px;border-radius:50%;border:2.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;position:relative;padding:0}
.check svg{opacity:0}
.ex.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ex.done .check svg{opacity:1}
.float{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-family:"Secular One",Arial,sans-serif;color:var(--gold);font-size:19px;pointer-events:none;white-space:nowrap;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}

.fig{width:86px;height:86px;border-radius:14px;background:var(--surface-2);display:block}
.ex.done .fig{background:var(--surface)}
.fig .limb{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.fig .back{opacity:.38}
.fig .head{fill:var(--ink)}
.fig .prop{stroke:var(--line-strong);stroke-width:3;stroke-linecap:round;fill:none}
.fig .thick{stroke-width:4.5}
.fig .propf{fill:var(--line-strong)}
.fig .acc{fill:var(--accent)}
.fig .accs{stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round}
.fig .fb{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .fig.anim .fa{animation:fa 1.8s infinite}
  .fig.anim .fb{animation:fb 1.8s infinite}
}
@keyframes fa{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}

.win{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:14px 16px;margin:14px 0 4px;display:flex;gap:14px;align-items:center}
.win .pts{font-family:"Secular One",Arial,sans-serif;font-size:30px;color:var(--gold);line-height:1}
.win b{font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:20px;display:block}
.win span{color:var(--muted);font-size:15px}
.win.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.win.pop,.float{animation:none}.float{display:none}}

.card{background:var(--surface);border-radius:18px;padding:18px;margin-top:18px}
.card h2{font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:24px;margin:0 0 4px;line-height:1.2}
.card p{margin:4px 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;margin-top:12px}
.backbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 0 0;min-height:44px}

.phase{margin:24px 0 8px;font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:20px}
.phase small{font-family:"Assistant",Arial,sans-serif;color:var(--muted);font-size:14px;font-weight:600;margin-inline-start:6px}
.week{display:grid;grid-template-columns:64px repeat(4,1fr);gap:6px;align-items:center;margin-bottom:6px}
.week .wl{font-weight:700;color:var(--muted);font-size:15px}
.week.cur .wl{color:var(--accent)}
.sp{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;padding:2px 4px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}
.sp small{font-weight:400;font-size:11px}
.sp.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sp.part{border-color:var(--accent);color:var(--accent)}
.sp.miss{border-style:dashed;opacity:.65}
.sp.today{box-shadow:0 0 0 3px var(--gold)}
.legend{color:var(--muted);font-size:14px;margin-top:14px}

.fam{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:380px){.fam{grid-template-columns:1fr}}
.fc{background:var(--surface);border-radius:18px;padding:14px 16px;border-top:6px solid var(--c)}
.fc .nm{font-family:"Secular One",Arial,sans-serif;font-size:22px}
.fc .big{font-family:"Secular One",Arial,sans-serif;font-size:46px;line-height:1;color:var(--c)}
.fc .big small{font-family:"Assistant",Arial,sans-serif;font-size:15px;color:var(--muted);font-weight:700;margin-inline-start:4px}
.fc dl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin:12px 0 8px;font-size:15px}
.fc dt{color:var(--muted)} .fc dd{margin:0;font-weight:700}
.fc .pbar{margin:0}
.fc .pbar i{background:var(--c)}
.note{color:var(--muted);font-size:15px;margin-top:16px}

.set{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;border-top:6px solid var(--c)}
.set h3{font-family:"Secular One",Arial,sans-serif;font-weight:400;font-size:22px;margin:0 0 10px}
.set label{display:block;font-weight:700;margin:12px 0 6px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);font-weight:700;padding:0}
.day[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.hint.bad{color:var(--shira);font-weight:700}
input[type="date"]{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);min-height:46px}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:8px 0;min-height:44px}

.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;border:0;background:none;padding:8px 0 10px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;min-height:58px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="brandrow"><div class="brand" dir="ltr">Fit<span>Fam</span></div><a class="lang" href="/" lang="en">English</a></div>

  </div>
</nav>

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function fmt(s){try{return parse(s).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});}catch(e){return s;}}

if(!state||!state.kids){state={active:'shira',kids:{shira:fresh(),yonatan:fresh()}};}
Object.keys(KIDS).forEach(function(k){if(!state.kids[k])state.kids[k]=fresh();});

var SB_URL='https://ogxebejcedpteknqwkbb.supabase.co',SB_KEY='sb_publishable_6PX3Lh3Z4bwOrewKU8LBPw_K1LB9t-j',FAMILY='Z5L84jFi4UVbGMqkud4kVH5y';

});
function rpc(fn,body){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json();});
}
function push(k){
  var K=state.kids[k],ts=K.ts;
  rpc('fitfam_put',{p_family:FAMILY,p_kid:k,p_data:K,p_ts:ts})
    .then(function(){if(state.kids[k].ts===ts){delete state.pending[k];save();}}).catch(function(){});
}
function touch(k){state.kids[k].ts=Date.now();state.pending[k]=true;save();push(k);}
function validKid(d){return d&&typeof d.start==='string'&&Array.isArray(d.days)&&d.done&&typeof d.done==='object';}
var pulling=false;
function pull(){
  if(pulling)return;pulling=true;
  rpc('fitfam_get',{p_family:FAMILY}).then(function(rows){
    var changed=false;
    (rows||[]).forEach(function(r){
      var L=state.kids[r.kid];
      if(L&&validKid(r.data)&&r.ts>(L.ts||0)){r.data.ts=r.ts;state.kids[r.kid]=r.data;delete state.pending[r.kid];changed=true;}
    });
    Object.keys(state.pending).forEach(push);
    if(changed){save();render();}
  }).catch(function(){}).then(function(){pulling=false;});
}

/* ---------- program logic ---------- */
function sessions(id){
  var k=state.kids[id],out=[];
  if(!k.days||k.days.length!==4)return out;
  var d=parse(k.start),g=0;
  while(out.length<40&&g<500){
    if(k.days.indexOf(d.getDay())>-1){var i=out.length;out.push({i:i,date:ymd(d),week:Math.floor(i/4)+1,type:TYPES[i%4]});}
    d.setDate(d.getDate()+1);g++;
  }
  return out;
}
function phaseOf(w){return w<=3?0:(w<=6?1:2);}
function items(id,s){
  var P=PROGRAM[id];
  if(s.type==='R'){var r=P.R;return [['walk',r.warm],['run',r.weeks[s.week-1],r.cue],['walk',r.cool]];}
  return P[s.type][phaseOf(s.week)];
}
function doneMap(id,i){return state.kids[id].done[i]||{};}
function doneCount(id,s){var d=doneMap(id,s.i);return items(id,s).filter(function(_,j){return d[j];}).length;}
function complete(id,s){return doneCount(id,s)===items(id,s).length;}
function points(id){var p=0;sessions(id).forEach(function(s){var c=doneCount(id,s);p+=c*PT_EX;if(c===items(id,s).length)p+=PT_BONUS;});return p;}
function streak(id){
  var ss=sessions(id).filter(function(s){return s.date<=TODAY;}),n=0;
  for(var x=ss.length-1;x>=0;x--){var s=ss[x];if(complete(id,s))n++;else if(s.date===TODAY)continue;else break;}
  return n;
}
function curWeek(id){var ss=sessions(id);var up=ss.filter(function(s){return s.date>=TODAY;})[0];return up?up.week:10;}
function weekDone(id,w){return sessions(id).filter(function(s){return s.week===w&&complete(id,s);}).length;}
function totalDone(id){return sessions(id).filter(function(s){return complete(id,s);}).length;}

/* ---------- drawing ---------- */
function frame(p,e,dir){
  var o='';
  o+='<polyline points="'+p.n+' '+p.le+' '+p.lh+'" class="limb back"/>';
  o+='<polyline points="'+p.p+' '+p.lk+' '+p.lf+'" class="limb back"/>';
  o+='<line x1="'+p.n[0]+'" y1="'+p.n[1]+'" x2="'+p.p[0]+'" y2="'+p.p[1]+'" class="limb"/>';
  o+='<polyline points="'+p.p+' '+p.rk+' '+p.rf+'" class="limb"/>';
  o+='<polyline points="'+p.n+' '+p.re+' '+p.rh+'" class="limb"/>';
  o+='<circle cx="'+p.h[0]+'" cy="'+p.h[1]+'" r="6.5" class="head"/>';
  if(e.x==='band')o+='<line x1="'+p.lk[0]+'" y1="'+p.lk[1]+'" x2="'+p.rk[0]+'" y2="'+p.rk[1]+'" class="accs" style="stroke-width:4"/>';
  if(e.x==='dumb'){[p.lh,p.rh].forEach(function(h){o+='<rect x="'+(h[0]-7)+'" y="'+(h[1]-2.5)+'" width="14" height="5" rx="2" class="acc"/>';});}
  if(e.x==='rope'){var cy=dir==='up'?-40:136;o+='<path d="M'+p.lh+' Q50,'+cy+' '+p.rh+'" class="accs"/>';}
  return o;
}
function fig(e){
  var props=(e.p||['floor']).map(function(k){return PROPS[k]||'';}).join('');
  var fb=e.b;
  if(fb&&e.fix){fb=Object.assign({},fb);e.fix.forEach(function(k){fb[k]=e.a[k];});}
  return '<svg class="fig'+(fb?' anim':'')+'" viewBox="0 -6 100 104" aria-hidden="true">'+props+
    '<g class="fa">'+frame(e.a,e,'up')+'</g>'+(fb?'<g class="fb">'+frame(fb,e,'down')+'</g>':'')+'</svg>';
}
var CHECK='<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- views ---------- */
function renderTop(){
  var id=state.active;
  document.documentElement.setAttribute('data-kid',id);
  document.getElementById('kids').innerHTML=Object.keys(KIDS).map(function(k){
    return '<button class="kid" data-act="kid" data-k="'+k+'" aria-pressed="'+(k===id)+'"><span class="dot">'+(KIDS[k].i||KIDS[k].name[0])+'</span>'+KIDS[k].name+'</button>';
  }).join('');
  var p=points(id),lvl=Math.floor(p/PER_LEVEL)+1,into=p%PER_LEVEL,w=curWeek(id);
  document.getElementById('jersey').innerHTML=
    '<div class="who">'+KIDS[id].name+'<small>שבוע '+w+' מתוך 10</small></div>'+
    '<div class="num" aria-label="רמה '+lvl+'">'+lvl+'</div>'+
    '<div class="stats"><div class="stat"><b>'+p+'</b><span>נקודות</span></div>'+
    '<div class="stat"><b>'+streak(id)+'</b><span>אימונים ברצף</span></div>'+
    '<div class="stat"><b>'+weekDone(id,w)+'/4</b><span>השבוע</span></div></div>'+
    '<div class="lvbar"><i style="width:'+(into/PER_LEVEL*100)+'%"></i></div>'+
    '<div class="next">רמה '+lvl+'. עוד '+(PER_LEVEL-into)+' נקודות לרמה '+(lvl+1)+'</div>';
  document.getElementById('gear').setAttribute('aria-pressed',ui.view==='settings');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    if(t.dataset.v===ui.view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
  });
}

function sessionView(id,s,fromPlan){
  var its=items(id,s),d=doneMap(id,s.i),c=doneCount(id,s),all=c===its.length;
  var pts=c*PT_EX+(all?PT_BONUS:0);
  var h='';
  if(fromPlan)h+='<button class="backbtn" data-act="back">חזרה לאימון של היום</button>';
  h+='<div class="shead"><h2>'+TITLES[s.type]+'</h2><div class="meta">אימון '+(s.i+1)+' מתוך 40, '+fmt(s.date)+(s.date===TODAY?' (היום)':'')+'</div></div>';
  if(all)h+='<div class="win'+(ui.pop===s.i?' pop':'')+'"><div class="pts">+'+PT_BONUS+'</div><div><b>האימון הושלם</b><span>בונוס על אימון שלם. נתראה באימון הבא.</span></div></div>';
  h+='<div class="prow"><span>'+c+' מתוך '+its.length+' תרגילים</span><span class="gold">'+pts+' נקודות</span></div>';
  h+='<div class="pbar"><i style="width:'+(c/its.length*100)+'%"></i></div>';
  its.forEach(function(it,j){
    var e=EX[it[0]],on=!!d[j];
    h+='<div class="ex'+(on?' done':'')+'">'+fig(e)+
      '<div><h3>'+e.n+'</h3><div class="rx">'+it[1]+'</div><div class="cue">'+(it[2]||e.c)+'</div></div>'+
      '<button class="check" data-act="tick" data-i="'+s.i+'" data-j="'+j+'" aria-pressed="'+on+'" aria-label="'+(on?'בוטל סימון':'סימון ביצוע')+': '+e.n+'">'+CHECK+'</button></div>';
  });
  return h;
}

function viewToday(){
  var id=state.active,ss=sessions(id);
  if(!ss.length)return '<div class="card"><h2>צריך לבחור 4 ימי אימון</h2><p>בהגדרות בוחרים תאריך התחלה ו-4 ימים בשבוע.</p><button class="btn" data-act="tab" data-v="settings">להגדרות</button></div>';
  if(ui.sel!==null&&ss[ui.sel])return sessionView(id,ss[ui.sel],true);
  var t=ss.filter(function(s){return s.date===TODAY;})[0];
  if(t)return sessionView(id,t,false);
  var next=ss.filter(function(s){return s.date>TODAY;})[0];
  if(!next)return '<div class="card"><h2>סיימת 10 שבועות</h2><p>'+totalDone(id)+' מתוך 40 אימונים הושלמו. הגיע הזמן למבחן ה-2 מייל.</p></div>';
  var first=ss[0].date>TODAY;
  return '<div class="card"><h2>'+(first?'התוכנית מתחילה '+fmt(next.date):'היום יום מנוחה')+'</h2>'+
    '<p>'+(first?'':'גם מנוחה בונה שריר. ')+'האימון הבא: '+fmt(next.date)+', '+TITLES[next.type]+'.</p>'+
    '<button class="btn" data-act="open" data-i="'+next.i+'">לראות את האימון הבא</button></div>';
}

function viewPlan(){
  var id=state.active,ss=sessions(id),cw=curWeek(id),h='';
  if(!ss.length)return viewToday();
  var ranges=[[1,3],[4,6],[7,10]];
  ranges.forEach(function(r,ph){
    h+='<div class="phase">שלב '+(ph+1)+': '+PHASES[id][ph]+'<small>שבועות '+r[0]+'-'+r[1]+'</small></div>';
    for(var w=r[0];w<=r[1];w++){
      h+='<div class="week'+(w===cw?' cur':'')+'"><div class="wl">שבוע '+w+'</div>';
      ss.filter(function(s){return s.week===w;}).forEach(function(s){
        var c=doneCount(id,s),n=items(id,s).length,cls='sp';
        if(c===n)cls+=' done';else if(c>0)cls+=' part';else if(s.date<TODAY)cls+=' miss';
        if(s.date===TODAY)cls+=' today';
        h+='<button class="'+cls+'" data-act="open" data-i="'+s.i+'">'+SHORT[s.type]+'<small>'+DAYN[parse(s.date).getDay()]+' '+parse(s.date).getDate()+'/'+(parse(s.date).getMonth()+1)+'</small></button>';
      });
      h+='</div>';
    }
  });
  h+='<p class="legend">צבע מלא: הושלם. מסגרת צבעונית: התחיל. מקווקו: פוספס, ועדיין אפשר להשלים. מסגרת זהב: היום.</p>';
  return h;
}

function viewFamily(){
  var h='<div class="fam">';
  Object.keys(KIDS).forEach(function(k){
    var p=points(k),lvl=Math.floor(p/PER_LEVEL)+1,w=curWeek(k),td=totalDone(k);
    h+='<div class="fc" style="--c:'+KIDS[k].c+'"><div class="nm">'+KIDS[k].name+'</div>'+
      '<div class="big">'+lvl+'<small>רמה</small></div>'+
      '<dl><dt>נקודות</dt><dd>'+p+'</dd><dt>אימונים ברצף</dt><dd>'+streak(k)+'</dd><dt>השבוע</dt><dd>'+weekDone(k,w)+'/4</dd><dt>סה״כ</dt><dd>'+td+'/40</dd></dl>'+
      '<div class="pbar"><i style="width:'+(td/40*100)+'%"></i></div></div>';
  });
  h+='</div><p class="note">הנקודות נספרות על התמדה: כל תרגיל שמסמנים ובונוס על אימון שלם. כל אחד מתחרה בעצמו מאתמול, לא במי שחזק יותר.</p>';
  return h;
}

function viewSettings(){
  var h='';
  Object.keys(KIDS).forEach(function(k){
    var K=state.kids[k],n=K.days.length;
    h+='<div class="set" style="--c:'+KIDS[k].c+'"><h3>'+KIDS[k].name+'</h3>'+
      '<label for="st-'+k+'">תאריך התחלה</label><input type="date" id="st-'+k+'" data-start="'+k+'" value="'+K.start+'">'+
      '<label>ימי אימון (4 בשבוע)</label><div class="days">';
    for(var d=0;d<7;d++)h+='<button class="day" data-act="day" data-k="'+k+'" data-d="'+d+'" aria-pressed="'+(K.days.indexOf(d)>-1)+'">'+DAYN[d]+'</button>';
    h+='</div><div class="hint'+(n!==4?' bad':'')+'">'+(n===4?'הסדר בכל שבוע: כוח, ריצה, רגליים, ריצה.':'נבחרו '+n+' ימים. צריך בדיוק 4.')+'</div>'+
      '<button class="reset" data-act="reset" data-k="'+k+'">איפוס ההתקדמות של '+KIDS[k].name+'</button></div>';
  });
  h+='<p class="note">ההתקדמות מסתנכרנת בין כל המכשירים של המשפחה.</p>';
  return h;
}

function render(){
  renderTop();
  var v=ui.view,h;
  if(v==='plan')h=viewPlan();else if(v==='family')h=viewFamily();else if(v==='settings')h=viewSettings();else h=viewToday();
  document.getElementById('view').innerHTML=h;
}

/* ---------- interactions ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='kid'){state.active=b.dataset.k;ui.sel=null;save();render();return;}
  if(a==='tab'){ui.view=b.dataset.v;ui.sel=null;render();window.scrollTo(0,0);return;}
  if(a==='open'){ui.view='today';ui.sel=+b.dataset.i;render();window.scrollTo(0,0);return;}
  if(a==='back'){ui.sel=null;render();return;}
  if(a==='tick'){
    var id=state.active,i=+b.dataset.i,j=+b.dataset.j,K=state.kids[id];
    var s=sessions(id)[i];var was=complete(id,s);
    var d=K.done[i]||(K.done[i]={});
    if(d[j])delete d[j];else d[j]=true;
    var on=!!d[j],now=complete(id,s);
    ui.pop=(!was&&now)?i:null;
    touch(id);render();
    if(on){
      try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
      var nb=document.querySelector('.check[data-i="'+i+'"][data-j="'+j+'"]');
      if(nb){var f=document.createElement('span');f.className='float';f.textContent='+'+PT_EX;nb.appendChild(f);setTimeout(function(){f.remove();},1000);}
    }
    return;
  }
  if(a==='day'){
    var k=b.dataset.k,dd=+b.dataset.d,K2=state.kids[k],ix=K2.days.indexOf(dd);
    if(ix>-1)K2.days.splice(ix,1);else K2.days.push(dd);
    K2.days.sort();touch(k);render();return;
  }
  if(a==='reset'){
    var k3=b.dataset.k;
    if(confirm('למחוק את כל הסימונים והנקודות של '+KIDS[k3].name+'?')){state.kids[k3].done={};touch(k3);render();}
    return;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.start&&t.value){state.kids[t.dataset.start].start=t.value;touch(t.dataset.start);render();}
});

render();
pull();
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
window.addEventListener('online',pull);
setInterval(function(){if(!document.hidden)pull();},20000);
})();
</script>
</body>
</html>
